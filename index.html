// ───────── ISBN helpers ─────────
function isbn13from10(d9){let c="978"+d9,s=0;for(let i=0;i<c.length;i++)s+=(i%2?3:1)*(+c[i]);return c+((10-s%10)%10);}
function canonical(raw){const d=(raw||"").replace(/\D/g,"");if(d.length>=13&&(d.slice(0,3)==="978"||d.slice(0,3)==="979"))return d.slice(0,13);if(d.length===9||d.length===10)return isbn13from10(d.slice(0,9));return d;}
const ISBN_TO_TITLE = {}; MASTER.forEach(b=>{ISBN_TO_TITLE[canonical(b.i)]=b.t;});
const ISBN_TO_PO = {}; MASTER.forEach(b=>{ISBN_TO_PO[canonical(b.i)]=b.p||"";});

function makeZpl(isbn){
 const d=isbn.replace(/\D/g,"");
 if(d.length===13) return "^XA\n^CI28\n^PW508\n^LL203\n^LS0\n^LH0,0\n^FO44,18\n^BY4,2.5\n^BEN,150,Y,N\n^FD"+d.slice(0,12)+"^FS\n^XZ\n";
 return "^XA\n^CI28\n^PW508\n^LL203\n^LS0\n^LH0,0\n^FO30,15\n^BY2,2.5\n^BCN,140,Y,N,N\n^FD"+(d||isbn)+"^FS\n^XZ\n";
}

// ───────── Zebra Browser Print (talks to the local helper) ─────────
const BP_BASES=["https://127.0.0.1:9101","https://localhost:9101"];
let bpBase=null, bpDevice=null;
async function bpFindPrinter(){
 for(const base of BP_BASES){
  try{
   const r=await fetch(base+"/default?type=printer",{cache:"no-store"});
   if(r.ok){ const dev=await r.json(); if(dev&&dev.uid){ bpBase=base; bpDevice=dev; return dev; } }
  }catch(e){}
 }
 return null;
}
async function bpPrint(zpl){
 if(!bpDevice && !await bpFindPrinter()) throw new Error("no-bridge");
 const r=await fetch(bpBase+"/write",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({device:bpDevice,data:zpl})});
 if(!r.ok) throw new Error("write-failed");
}
async function refreshPrinter(){
 const s=$('pstatus'); s.className="wait"; s.textContent="Printer: checking…";
 const dev=await bpFindPrinter();
 if(dev){ s.className="ok"; s.textContent="Printer: "+(dev.name||"ready"); $('setup').style.display="none"; }
 else{
  s.className="bad"; s.textContent="Printer: not found — tap to retry";
  $('setup').style.display="block";
  $('setup').innerHTML="To print, this computer needs <b>Zebra Browser Print</b> running, with the Zebra plugged in by USB. "+
    "Install it once from Zebra (free), make sure it’s running, then tap “Printer: not found” to retry. "+
    "You can still scan and mark the sheet without it.";
 }
}
$('pstatus').onclick=refreshPrinter;

// ───────── Sheet coloring (fire-and-forget, cross-origin) ─────────
function colorSheet(isbn){
 if(!SHEET_HOOK_URL) return;
 fetch(SHEET_HOOK_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
   body:JSON.stringify({isbn:isbn,secret:SHEET_HOOK_SECRET})}).catch(()=>{});
}

// ───────── Feedback ─────────
function beep(ok){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?880:220;o.type=ok?"sine":"square";g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.2)}catch(e){}}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

// ───────── The main action ─────────
let lastCode="", lastAt=0;
let currentIsbn=null;
function lookup(rawInput){                    // find the book — does NOT print
 const now=Date.now();
 const isbn=canonical(rawInput);
 if(!isbn||isbn.length<10) return;
 if(isbn===lastCode && now-lastAt<2500) return;
 lastCode=isbn; lastAt=now;
 const title=ISBN_TO_TITLE[isbn];
 const r=$('result');
 if(!title){
  currentIsbn=null; r.className="bad";
  r.innerHTML='<div class="v">⚠ NOT in your list</div><div class="t">Scanned: '+esc(isbn)+'</div><div class="i">likely a misread — scan it again</div>';
  beep(false); if(navigator.vibrate)navigator.vibrate([90,60,90]); return;
 }
 currentIsbn=isbn;
 const po=ISBN_TO_PO[isbn];
 const poLine=po?'<div class="po">PO '+esc(po)+'</div>':'<div class="po nopo">— no PO —</div>';
 r.className="ok";
 r.innerHTML=poLine+'<div class="t">'+esc(title)+'</div><div class="i">'+isbn+'</div>'
   +'<button class="btn" id="printBtn">Print label</button>';
 $('printBtn').onclick=doPrint;
 beep(true); if(navigator.vibrate)navigator.vibrate(60);
}
async function doPrint(){                      // the Print button → actually prints + colors the sheet
 if(!currentIsbn) return;
 const isbn=currentIsbn, title=ISBN_TO_TITLE[isbn]||"", po=ISBN_TO_PO[isbn]||"";
 const btn=$('printBtn'); if(btn){btn.disabled=true; btn.textContent="Printing…";}
 const r=$('result'); const poLine=po?'<div class="po">PO '+esc(po)+'</div>':'';
 colorSheet(isbn);
 try{
  await bpPrint(makeZpl(isbn));
  r.innerHTML=poLine+'<div class="t">'+esc(title)+'</div><div class="i">'+isbn+'</div><div class="i">🏷️ label printed</div>';
 }catch(e){
  r.innerHTML=poLine+'<div class="t">'+esc(title)+'</div><div class="i">'+isbn+'</div><div class="i" style="color:#c0362f">marked in sheet, but printer not connected — tap “Printer” above</div>';
  refreshPrinter();
 }
}

// ───────── Tabs ─────────
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));

});

// ───────── Camera scanning: fast native BarcodeDetector, ZXing fallback (iPhone) ─────────
const ISBN_SET=new Set(MASTER.map(b=>canonical(b.i)));
let scanning=false, vStream=null, detector=null, rafId=null, zx=null, pendingMiss=null, pendingTimer=null;
const hints=new Map();
if(window.ZXing){hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]);}
function onScan(text){
 const code=canonical(text);
 const isIsbn=code.length===13 && (code.slice(0,3)==="978"||code.slice(0,3)==="979");
 if(!isIsbn) return;                          // ignore price/store barcodes → keep scanning
 if(ISBN_SET.has(code)){ clearTimeout(pendingTimer); pendingMiss=null; lookup(code); }
 else if(pendingMiss!==code){ pendingMiss=code; clearTimeout(pendingTimer); pendingTimer=setTimeout(()=>{ if(pendingMiss===code){ lookup(code); pendingMiss=null; } },1400); }
}
function autofocus(){try{const tr=vStream&&vStream.getVideoTracks&&vStream.getVideoTracks()[0];const caps=tr&&tr.getCapabilities&&tr.getCapabilities();if(caps&&caps.focusMode&&caps.focusMode.indexOf('continuous')>=0)tr.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(e){}}
async function detLoop(){ if(!scanning)return; try{const codes=await detector.detect($('video'));if(codes&&codes.length)onScan(codes[0].rawValue);}catch(e){} if(scanning)rafId=requestAnimationFrame(detLoop); }
async function startCam(){
 const constraints={video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}};
 let useNative=false;
 if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();useNative=f.indexOf('ean_13')>=0;}catch(e){}}
 try{
  if(useNative){
   detector=new BarcodeDetector({formats:['ean_13']});
   vStream=await navigator.mediaDevices.getUserMedia(constraints);
   $('video').srcObject=vStream; await $('video').play(); autofocus(); scanning=true; detLoop();
  }else if(window.ZXing){
   zx=new ZXing.BrowserMultiFormatReader(hints); try{zx.timeBetweenScansMillis=90;}catch(e){}
   await zx.decodeFromConstraints(constraints,$('video'),(res)=>{if(res)onScan(res.getText());});
   vStream=$('video').srcObject; autofocus(); scanning=true;
  }else{ alert("No scanner available on this browser."); return; }
  $('camBtn').textContent="Stop camera"; $('camBtn').classList.add('grey');
 }catch(e){ alert("Camera error: "+(e.message||e.name)); }
}
function stopCam(){ scanning=false; if(rafId)cancelAnimationFrame(rafId); if(zx){try{zx.reset();}catch(e){}zx=null;} if(vStream){vStream.getTracks().forEach(t=>t.stop());vStream=null;} try{$('video').srcObject=null;}catch(e){} $('camBtn').textContent="Start camera"; $('camBtn').classList.remove('grey'); }
$('camBtn').onclick=()=>{ scanning?stopCam():startCam(); };
$('manual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();e.target.value='';if(v)lookup(v);}});

// ───────── Title search ─────────
function nrm(s){return(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();}
$('search').addEventListener('input',e=>{
 const q=nrm(e.target.value), box=$('results'); box.innerHTML="";
 if(!q)return;
 const toks=q.split(" ");
 MASTER.filter(b=>{const t=nrm(b.t);return toks.every(k=>t.includes(k));}).slice(0,30).forEach(b=>{
  const el=document.createElement('button');el.className="bk";
  el.innerHTML=esc(b.t)+'<span class="bi">'+b.i+'</span>';
  el.onclick=()=>{lookup(b.i);e.target.value="";box.innerHTML="";};
  box.appendChild(el);
 });
 if(!box.children.length)box.innerHTML='<div class="hint">No titles match “'+esc(e.target.value)+'”.</div>';
});

// try to connect to the printer on load
refreshPrinter();
